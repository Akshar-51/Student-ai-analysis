{% extends 'base.html' %}
{% block title %}Error {{ error_code }}{% endblock %}
{% block header_title %}System Notification{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-16">
    <div class="w-16 h-16 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-2xl mx-auto mb-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h2 class="text-2xl font-bold text-slate-900 mb-2">Error {{ error_code }}</h2>
    <p class="text-sm text-slate-600 mb-6">{{ message }}</p>
    <a href="{{ url_for('dashboard') }}" class="inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition">
        Return to Dashboard
    </a>
</div>
{% endblock %}
